services:

  postgres:
    image: postgres:16                          #baixa a imagem oficial
    container_name: daedalus_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"                             # Porta para acessa o banco
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
